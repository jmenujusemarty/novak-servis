<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>CMS | Autoservis Janov</title>
    <style>
      :root {
        --bg: #f5f7f6;
        --paper: #ffffff;
        --ink: #11161c;
        --muted: #64707a;
        --line: #dce4e1;
        --green: #0c513b;
        --red: #b4232a;
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(14px);
      }

      .topbar,
      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 84px;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 4px;
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1;
      }

      .topbar p {
        margin: 0;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      button,
      a.button,
      label.file-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid rgba(12, 81, 59, 0.22);
        border-radius: 7px;
        background: #fff;
        color: var(--green);
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--green);
        background: var(--green);
        color: #fff;
      }

      button.danger {
        border-color: rgba(180, 35, 42, 0.22);
        color: var(--red);
      }

      input[type="file"] {
        display: none;
      }

      main {
        padding: 28px 0 64px;
      }

      .status {
        min-height: 28px;
        margin-bottom: 18px;
        color: var(--green);
        font-weight: 700;
      }

      .section {
        margin-top: 18px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
      }

      .section h2 {
        margin-bottom: 18px;
        font-size: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      label {
        display: grid;
        gap: 7px;
        color: #253039;
        font-size: 13px;
        font-weight: 750;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 15px;
      }

      input {
        min-height: 42px;
        padding: 0 12px;
      }

      textarea {
        min-height: 92px;
        padding: 11px 12px;
        resize: vertical;
      }

      .span-2 {
        grid-column: 1 / -1;
      }

      .array-list {
        display: grid;
        gap: 12px;
      }

      .object-grid {
        display: grid;
        gap: 16px;
      }

      .array-item {
        display: grid;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fbfcfb;
      }

      .array-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .array-head h3 {
        margin: 0;
        font-size: 16px;
      }

      .helper {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .nested {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fbfcfb;
      }

      .nested > h3 {
        margin-bottom: 14px;
        font-size: 18px;
      }

      .json-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }

      @media (max-width: 800px) {
        .topbar {
          display: block;
          padding: 18px 0;
        }

        .actions {
          justify-content: flex-start;
          margin-top: 16px;
        }

        .section {
          padding: 18px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .span-2 {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="topbar">
        <div>
          <h1>CMS Autoservis Janov</h1>
          <p>Jednoduchá správa obsahu pro statický web.</p>
        </div>
        <div class="actions">
          <button class="primary" id="save-button" type="button">Uložit</button>
          <a class="button" href="index.html" target="_blank" rel="noreferrer">Náhled webu</a>
          <button id="export-button" type="button">Export JSON</button>
          <label class="file-button" for="import-file">Import JSON</label>
          <input id="import-file" type="file" accept="application/json">
          <button class="danger" id="reset-button" type="button">Obnovit výchozí</button>
        </div>
      </div>
    </header>

    <main>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <form id="cms-form"></form>
    </main>

    <script src="cms.js"></script>
    <script>
      const form = document.querySelector("#cms-form");
      const status = document.querySelector("#status");
      let content = SiteCMS.load();

      const get = (path) => path.split(".").reduce((value, key) => value?.[key], content);
      const set = (path, value) => {
        const parts = path.split(".");
        const key = parts.pop();
        const parent = parts.reduce((target, part) => target[part], content);
        parent[key] = value;
      };

      const showStatus = (message) => {
        status.textContent = message;
        window.clearTimeout(showStatus.timer);
        showStatus.timer = window.setTimeout(() => {
          status.textContent = "";
        }, 3200);
      };

      const humanize = (key) =>
        String(key)
          .replace(/([A-Z])/g, " $1")
          .replace(/[-_]/g, " ")
          .replace(/^./, (letter) => letter.toUpperCase());

      const isPrimitiveArray = (value) => Array.isArray(value) && value.every((item) => ["string", "number", "boolean"].includes(typeof item));
      const isLongText = (key, value) => /text|lead|caption|source|note|extra|description|alt/i.test(key) || String(value).length > 70;

      const makeTextField = (path, labelText, type = "text") => {
        const label = document.createElement("label");
        const span = document.createElement("span");
        const input = type === "textarea" ? document.createElement("textarea") : document.createElement("input");
        span.textContent = labelText;
        input.value = get(path) || "";
        input.addEventListener("input", () => set(path, input.value));
        label.append(span, input);
        if (type === "textarea") label.classList.add("span-2");
        return label;
      };

      const makeBooleanField = (path, labelText) => {
        const label = document.createElement("label");
        const span = document.createElement("span");
        const input = document.createElement("input");
        span.textContent = labelText;
        input.type = "checkbox";
        input.checked = Boolean(get(path));
        input.addEventListener("change", () => set(path, input.checked));
        label.append(span, input);
        return label;
      };

      const makeListField = (path, labelText) => {
        const label = makeTextField(path, labelText, "textarea");
        const input = label.querySelector("textarea");
        input.value = (get(path) || []).join("\n");
        input.addEventListener("input", () => {
          set(
            path,
            input.value
              .split("\n")
              .map((item) => item.trim())
              .filter(Boolean),
          );
        });
        const helper = document.createElement("p");
        helper.className = "helper";
        helper.textContent = "Každá položka na samostatný řádek.";
        label.append(helper);
        return label;
      };

      const makeArrayEditor = (path, labelText) => {
        const wrapper = document.createElement("div");
        wrapper.className = "span-2 array-list";
        const head = document.createElement("div");
        head.className = "array-head";
        const title = document.createElement("h3");
        const add = document.createElement("button");
        title.textContent = labelText;
        add.type = "button";
        add.textContent = "Přidat";
        head.append(title, add);
        wrapper.append(head);

        const list = document.createElement("div");
        list.className = "array-list";
        wrapper.append(list);

        const template = () => {
          const current = get(path);
          const sample = current.find((item) => item && typeof item === "object" && !Array.isArray(item));
          if (sample) {
            return Object.fromEntries(
              Object.entries(sample).map(([key, value]) => {
                if (Array.isArray(value)) return [key, []];
                if (typeof value === "boolean") return [key, false];
                if (typeof value === "number") return [key, 0];
                if (value && typeof value === "object") return [key, {}];
                return [key, ""];
              }),
            );
          }
          return "";
        };

        const render = () => {
          list.replaceChildren();
          (get(path) || []).forEach((item, index) => {
            const row = document.createElement("div");
            row.className = "array-item";
            const rowHead = document.createElement("div");
            rowHead.className = "array-head";
            const rowTitle = document.createElement("h3");
            const remove = document.createElement("button");
            rowTitle.textContent = `${index + 1}. ${item.title || item.name || item.label || item.quote || "Položka"}`;
            remove.type = "button";
            remove.className = "danger";
            remove.textContent = "Odebrat";
            remove.addEventListener("click", () => {
              get(path).splice(index, 1);
              render();
            });
            rowHead.append(rowTitle, remove);
            row.append(rowHead);

            if (typeof item === "object" && item !== null && !Array.isArray(item)) {
              row.append(renderObject(`${path}.${index}`, item, false));
            } else {
              row.append(makeTextField(`${path}.${index}`, `${labelText} ${index + 1}`, isLongText(path, item) ? "textarea" : "text"));
            }
            list.append(row);
          });
        };

        add.addEventListener("click", () => {
          get(path).push(template());
          render();
        });

        render();
        return wrapper;
      };

      const renderValue = (path, key, value) => {
        if (isPrimitiveArray(value)) return makeListField(path, humanize(key));
        if (Array.isArray(value)) return makeArrayEditor(path, humanize(key));
        if (value && typeof value === "object") {
          const wrapper = document.createElement("div");
          wrapper.className = "span-2 nested";
          const heading = document.createElement("h3");
          heading.textContent = humanize(key);
          wrapper.append(heading, renderObject(path, value, false));
          return wrapper;
        }
        if (typeof value === "boolean") return makeBooleanField(path, humanize(key));
        return makeTextField(path, humanize(key), isLongText(key, value) ? "textarea" : "text");
      };

      const renderObject = (basePath, object, wrap = true) => {
        const grid = document.createElement("div");
        grid.className = "grid";
        Object.entries(object).forEach(([key, value]) => {
          grid.append(renderValue(basePath ? `${basePath}.${key}` : key, key, value));
        });
        if (!wrap) return grid;
        const section = document.createElement("section");
        section.className = "section";
        const heading = document.createElement("h2");
        heading.textContent = humanize(basePath);
        section.append(heading, grid);
        return section;
      };

      const renderForm = () => {
        form.replaceChildren();
        Object.entries(content).forEach(([key, value]) => {
          form.append(renderObject(key, value));
        });
      };

      document.querySelector("#save-button").addEventListener("click", () => {
        SiteCMS.save(content);
        showStatus("Lokální náhled uložen. Pro produkci stáhněte Export JSON a nahraďte cms-content.json.");
      });

      document.querySelector("#export-button").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(SiteCMS.deepMerge(SiteCMS.defaults, content), null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "cms-content.json";
        link.click();
        URL.revokeObjectURL(link.href);
      });

      document.querySelector("#import-file").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        content = JSON.parse(await file.text());
        SiteCMS.save(content);
        renderForm();
        showStatus("JSON importován a uložen.");
        event.target.value = "";
      });

      document.querySelector("#reset-button").addEventListener("click", () => {
        if (!confirm("Opravdu obnovit výchozí obsah?")) return;
        SiteCMS.reset();
        content = SiteCMS.load();
        renderForm();
        showStatus("Výchozí obsah obnoven.");
      });

      SiteCMS.loadPublished().then((published) => {
        if (!localStorage.getItem(SiteCMS.STORAGE_KEY)) {
          content = published;
        }
        renderForm();
      });
    </script>
  </body>
</html>
